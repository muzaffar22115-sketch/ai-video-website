<!DOCTYPE html>
<html>
<head>
  <title>AI Video Hub</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: white;
      padding: 40px;
    }

    .box {
      background: #222;
      padding: 30px;
      border-radius: 20px;
      max-width: 500px;
      margin: auto;
    }

    input {
      width: 90%;
      padding: 12px;
      border-radius: 10px;
      margin: 20px;
      box-sizing: border-box;
    }

    button {
      background: red;
      color: white;
      padding: 15px 25px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎬 AI Video Hub</h1>
  <p>Create AI Videos Easily</p>

  <input id="prompt" placeholder="Write your video idea">

  <br>

  <button onclick="generateVideo()">
    Generate AI Video
  </button>

  <p id="result"></p>

  <div id="videoContainer"></div>

</div>

<script>

async function generateVideo() {

  const prompt = document.getElementById("prompt").value.trim();
  const result = document.getElementById("result");
  const videoContainer = document.getElementById("videoContainer");

  if (!prompt) {
    result.innerText = "Please enter a video idea.";
    return;
  }

  result.innerText = "⏳ Creating your AI video...";
  videoContainer.innerHTML = "";

  try {

    const response = await fetch("/generate-video", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt
      })
    });

    const text = await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(
        "Server returned an unexpected response. Please check Render Logs."
      );
    }

    if (!response.ok) {
      throw new Error(data.error || "Video generation failed.");
    }

    if (data.status === "completed" && data.videoUrl) {

      result.innerText = "✅ Video ready!";

      videoContainer.innerHTML =
        '<video controls src="' + data.videoUrl + '"></video>' +
        '<br><br>' +
        '<a href="' + data.videoUrl +
        '" download style="color:white;">Download Video</a>';

      return;
    }

    throw new Error("Video URL was not returned.");

  } catch (error) {

    result.innerText = "❌ " + error.message;

  }
}

</script>

</body>
</html>
